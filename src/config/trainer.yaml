hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 1024
  max_response_length: 1024
  train_batch_size: 256
  return_raw_chat: True
  shuffle: False

actor_rollout_ref:
  hybrid_engine: True

  rollout:
    agent:
      agent_loop_config_path: src/config/metathought.yaml
    name: vllm
    mode: async
    multi_turn:
      enable: False
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.8
    max_model_len: 16384
    max_num_seqs: 1024
    log_prob_micro_batch_size_per_gpu: 32
    log_prob_use_dynamic_bsz: False
    log_prob_max_token_len_per_gpu: 32768
    disable_log_stats: False
    multi_stage_wake_up: False
    engine_kwargs:
      vllm: {}
      sglang: {}
  actor:
    strategy: fsdp2
    fsdp_config:
      param_offload: True
      optimizer_offload: True
      model_dtype: bfloat16
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 32768
    grad_clip: 1.0
    clip_ratio: 0.30
    entropy_coeff: 0.000
    use_kl_loss: False
  ref:
    fsdp_config:
      param_offload: True
      optimizer_offload: True
      model_dtype: bfloat16
custom_reward_function:
  path: src/reward/compute_score.py
  name: compute_score